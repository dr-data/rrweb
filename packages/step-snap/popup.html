<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: sans-serif; width: 300px; padding: 16px; margin: 0; }
    button { width: 100%; padding: 10px; margin-bottom: 10px; cursor: pointer; border: none; border-radius: 4px; font-weight: bold; }
    #startBtn { background: #4caf50; color: white; }
    #stopBtn { background: #f44336; color: white; display: none; }
    #pauseBtn, #resumeBtn { background: #ff9800; color: white; display: none; }
    #historyBtn { background: #2196f3; color: white; }
    .status { margin-top: 10px; font-size: 14px; text-align: center; }
    #thumbnail { max-width: 100%; margin-top: 10px; border-radius: 4px; display: none; }
  </style>
</head>
<body>
  <h2>StepSnap</h2>
  <button id="startBtn">Start Recording</button>
  <button id="pauseBtn">Pause</button>
  <button id="resumeBtn">Resume</button>
  <button id="stopBtn">Stop & Save</button>
  <hr>
  <button id="historyBtn">History</button>

  <div class="status" id="statusText">Ready to record</div>
  <img id="thumbnail" />

  <script src="popup.js"></script>
</body>
</html>
